  # prod-deploy.yml
  # master branch 로 pull request 가 merge 되었을 때 실행됨

  on:
    pull_request:
      types:
      - closed
      branches:
        - master

  jobs:
    deploy:
      runs-on: ubuntu-latest
      environment: production

      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

        - name: Setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '22'

        - name: Cache Node Modules
          uses: actions/cache@v3
          id: cache
          with:
            path: node_modules
            key: npm-packages-${{ hashFiles('./package-lock.json') }}

        - name: Install Dependencies
          if: steps.cache.outputs.cache-hit != 'true'
          run: npm install
          working-directory: ./

        - name: Run Tests
          run: npm run test

        - name: Generate Swagger Documentation
          run: npm run docs

        - name: Convert Swagger Documentation to Postman Collection
          run: npm run docs-convert

        - name: Upload to Postman
          env:
            POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
            POSTMAN_COLLECTION_ID: ${{ secrets.POSTMAN_COLLECTION_ID }}
          run: |
            POSTMAN_JSON_PATH="./docs/postman-output.json"

            curl -X PUT \
              "https://api.getpostman.com/collections/$POSTMAN_COLLECTION_ID" \
              -H "X-Api-Key: $POSTMAN_API_KEY" \
              -H "Content-Type: application/json" \
              --data @"$POSTMAN_JSON_PATH"

